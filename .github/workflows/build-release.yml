name: AetherXIV 2.0 Runtime Update
run-name: ${{ inputs.build_name || 'AetherXIV 2.0 Runtime Update' }}

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Name shown for this release build.
        required: true
        default: Patch Helper + Tutorial Update
      release_tag:
        description: Release tag to create or update.
        required: true
        default: release-v2.0
      publish_release:
        description: Publish the AetherXIV 2.0 GitHub Release after all builds pass.
        type: boolean
        required: true
        default: true
  push:
    branches:
      - "2.0"
    tags:
      - "release-v2.0"

permissions:
  contents: write

concurrency:
  group: aetherxiv-2.0-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CONFIGURATION: Release
  BUILD_NUMBER: 21990
  RELEASE_NAME: AetherXIV 2.0 Build 21990

jobs:
  verify:
    name: Verify source and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run the complete verification suite
        run: ./tools/Development/verify-aetherxiv.sh

  build-linux:
    name: Build Linux x64
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Windows x86 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-mingw-w64-i686 xz-utils xvfb

      - name: Build the Linux release
        run: ./tools/Linux/build-aetherxiv.sh "${BUILD_CONFIGURATION}"

      - name: Smoke-test the pinned Linux Wine runtime
        run: |
          runtime_root="${RUNNER_TEMP}/aetherxiv-linux-wine"
          archive="${runtime_root}/wine.tar.xz"
          mkdir -p "${runtime_root}/extract"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-amd64-wow64.tar.xz
          echo "39574efa1132c3ca0d5c77dd2eddbe4a49cca0d6cc2c290ff4924493a1c40314  ${archive}" | sha256sum --check
          tar -xJf "${archive}" -C "${runtime_root}/extract"
          wine="${runtime_root}/extract/wine-11.0-amd64-wow64/bin/wine"
          wineboot="${runtime_root}/extract/wine-11.0-amd64-wow64/bin/wineboot"
          wineserver="${runtime_root}/extract/wine-11.0-amd64-wow64/bin/wineserver"
          helper="bin/build/Release/Linux/launcher/app/Helpers/win-x64/AetherXIV.Launcher.ClientLauncher.exe"
          injector="bin/build/Release/Linux/launcher/app/Helpers/win-x64/Umbra.NativeInjector.x86.exe"
          "${wine}" --version
          timeout 120s xvfb-run -a env \
            WINEDEBUG=-all \
            WINEDLLOVERRIDES=mscoree,mshtml= \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wineboot}" -u
          timeout 30s env \
            WINEDEBUG=-all \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wineserver}" -w
          timeout 60s xvfb-run -a env \
            WINEDEBUG=-all \
            WINEDLLOVERRIDES=mscoree,mshtml= \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wine}" "${helper}" --probe | tee "${runtime_root}/probe.log"
          timeout 60s xvfb-run -a env \
            WINEDEBUG=-all \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wine}" "${injector}" --probe | tee "${runtime_root}/injector-probe.log"
          timeout 30s env \
            WINEDEBUG=-all \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wineserver}" -w
          grep -Fq "AETHERXIV_CLIENT_HELPER_OK" "${runtime_root}/probe.log"
          grep -Fq "AETHERXIV_NATIVE_INJECTOR_OK" "${runtime_root}/injector-probe.log"

      - name: Package the Linux release
        run: |
          mkdir -p artifacts
          tar -czf artifacts/AetherXIV-2.0.21990-Linux-x64.tar.gz -C bin/build/Release Linux

      - name: Upload the Linux release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.0.21990-Linux-x64
          path: artifacts/*
          if-no-files-found: error

  build-steamos:
    name: Build SteamOS x64
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Windows x86 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-mingw-w64-i686

      - name: Build the SteamOS release
        run: ./tools/SteamOS/build-aetherxiv.sh "${BUILD_CONFIGURATION}"

      - name: Package the SteamOS release
        run: |
          mkdir -p artifacts
          tar -czf artifacts/AetherXIV-2.0.21990-SteamOS-x64.tar.gz -C bin/build/Release SteamOS

      - name: Upload the SteamOS release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.0.21990-SteamOS-x64
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Windows x86 cross-compiler
        run: |
          # GitHub's macOS image may carry an untrusted, unrelated AWS tap.
          # Remove it quietly before invoking Homebrew so it cannot annotate this build.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install mingw-w64

      - name: Build the macOS release
        run: ./tools/MacOS/build-aetherxiv.sh "${BUILD_CONFIGURATION}"

      - name: Smoke-test the pinned macOS Wine runtime
        run: |
          runtime_root="${RUNNER_TEMP}/aetherxiv-macos-wine"
          archive="${runtime_root}/wine.tar.xz"
          mkdir -p "${runtime_root}/extract"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.0_1/wine-stable-11.0_1-osx64.tar.xz
          echo "b50dc50ec7f41d58b115a6b685d4d1315ba3c797bd3aa0f49213f2703cb82388  ${archive}" | shasum -a 256 --check
          tar -xJf "${archive}" -C "${runtime_root}/extract"
          wine="${runtime_root}/extract/Wine Stable.app/Contents/Resources/wine/bin/wine"
          helper="bin/build/Release/MacOS/AetherXIV Launcher.app/Contents/MacOS/Helpers/win-x64/AetherXIV.Launcher.ClientLauncher.exe"
          injector="bin/build/Release/MacOS/AetherXIV Launcher.app/Contents/MacOS/Helpers/win-x64/Umbra.NativeInjector.x86.exe"
          "${wine}" --version
          WINEDEBUG=-all \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wine}" "${helper}" --probe | tee "${runtime_root}/probe.log"
          WINEDEBUG=-all \
            WINEPREFIX="${runtime_root}/prefix" \
            "${wine}" "${injector}" --probe | tee "${runtime_root}/injector-probe.log"
          grep -Fq "AETHERXIV_CLIENT_HELPER_OK" "${runtime_root}/probe.log"
          grep -Fq "AETHERXIV_NATIVE_INJECTOR_OK" "${runtime_root}/injector-probe.log"

      - name: Package the macOS release
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            bin/build/Release/MacOS \
            artifacts/AetherXIV-2.0.21990-MacOS-arm64.zip

      - name: Upload the macOS release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.0.21990-MacOS-arm64
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the Windows release
        shell: pwsh
        run: ./tools/Windows/build-aetherxiv.ps1 -Configuration $env:BUILD_CONFIGURATION

      - name: Package the Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "bin/build/Release/Windows" -DestinationPath "artifacts/AetherXIV-2.0.21990-Windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload the Windows release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.0.21990-Windows-x64
          path: artifacts/*
          if-no-files-found: error

  build-docker:
    name: Validate Docker server (amd64 + arm64)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      AETHERXIV_DB_ROOT_PASSWORD: ci-root-password
      AETHERXIV_DB_PASSWORD: ci-server-password
      AETHERXIV_PUBLIC_HOST: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate the Compose model
        run: docker compose config --quiet

      - name: Build both server architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=aetherxiv-server
          cache-to: type=gha,mode=max,scope=aetherxiv-server

      - name: Start the complete Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Verify MariaDB and Launcher Services
        run: |
          docker compose ps
          docker compose exec -T mariadb mariadb \
            --user=root \
            --password="${AETHERXIV_DB_ROOT_PASSWORD}" \
            --execute="USE ffxiv_server; SELECT COUNT(*) AS server_count FROM servers;"
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/launcher/status

      - name: Capture Docker logs after a failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the Compose stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  publish-release:
    name: Publish AetherXIV 2.0
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && needs.build-linux.result == 'success' && needs.build-steamos.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-docker.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.publish_release) }}
    needs:
      - verify
      - build-linux
      - build-steamos
      - build-macos
      - build-windows
      - build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-AetherXIV-2.0.21990-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Replace the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            release_tag="${INPUT_RELEASE_TAG:-release-v2.0}"
            git tag --force "${release_tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${release_tag}" --force
          fi

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release delete "${release_tag}" --yes
          fi

          gh release create "${release_tag}" "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes-file docs/AETHERXIV_2.0_RELEASE_NOTES.md
